<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewport Measure</title>
<style>
  :root{color-scheme:dark}
  html,body{height:100%;margin:0}
  body{background:#0d1117;color:#e6edf3;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center}
  .big{font-size:38px;font-weight:800;letter-spacing:.5px}
  .sub{font-size:15px;color:#8b97a7}
  table{border-collapse:collapse;font-size:14px}
  td{padding:4px 10px;border-top:1px solid #2a3441;font-variant-numeric:tabular-nums}
  td:first-child{color:#8b97a7;text-align:right}
  .hint{font-size:13px;color:#6b7686;max-width:30em}
</style>
</head>
<body>
  <div class="sub">Usable web page area on this phone</div>
  <div class="big" id="vp">–</div>
  <div class="sub" id="pct">–</div>
  <table>
    <tr><td>Full screen</td><td id="scr">–</td></tr>
    <tr><td>Large viewport (bars hidden)</td><td id="lvh">–</td></tr>
    <tr><td>Browser UI takes</td><td id="eat">–</td></tr>
    <tr><td>Pixel ratio</td><td id="dpr">–</td></tr>
  </table>
  <div class="hint">Numbers update as you scroll and the toolbars shrink. Read them before scrolling for the "toolbars showing" figure.</div>
<script>
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:100lvh;pointer-events:none;visibility:hidden';
  document.body.appendChild(probe);
  function show(){
    const w = window.innerWidth, h = window.innerHeight;
    const scrW = screen.width, scrH = screen.height;
    const lvh = Math.round(probe.getBoundingClientRect().height) || scrH;
    document.getElementById('vp').textContent = w + ' × ' + h;
    document.getElementById('pct').textContent = Math.round(h / scrH * 100) + '% of the ' + scrH + 'px screen';
    document.getElementById('scr').textContent = scrW + ' × ' + scrH;
    document.getElementById('lvh').textContent = w + ' × ' + lvh;
    document.getElementById('eat').textContent = (scrH - h) + 'px';
    document.getElementById('dpr').textContent = window.devicePixelRatio;
  }
  show();
  addEventListener('resize', show);
  addEventListener('scroll', show);
</script>
</body>
</html>
